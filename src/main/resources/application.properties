spring.application.name=equipment-inspection-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/equipment_inspection}
spring.datasource.username=${DB_USERNAME:equipment_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
