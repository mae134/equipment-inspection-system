<!doctype html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ダッシュボード</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>

  <body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="ui-page">
      <header class="ui-page-header">
        <h1>ダッシュボード</h1>
      </header>

      <form class="equipment-search" th:action="@{/dashboard}" method="get">
        <div class="ui-form-field">
          <label class="ui-form-label" for="keyword">設備検索</label>

          <input
            class="ui-input"
            id="keyword"
            type="text"
            name="keyword"
            th:value="${keyword}"
            placeholder="設備コード・設備名・メーカー・設置場所"
          />
        </div>

        <button class="ui-button ui-button-primary" type="submit">検索</button>
      </form>

      <div class="equipment-actions" sec:authorize="hasRole('ADMIN')">
        <a class="ui-button ui-button-primary" th:href="@{/equipment/new}">
          新規登録
        </a>
      </div>

      <section aria-labelledby="equipment-list-title">
        <h2 id="equipment-list-title">設備一覧</h2>

        <div class="ui-table-wrapper">
          <table
            class="ui-table equipment-table"
            th:unless="${#lists.isEmpty(equipmentList)}"
          >
            <thead>
              <tr>
                <th>設備コード</th>
                <th>設備名</th>
                <th>メーカー</th>
                <th>設置場所</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="equipment : ${equipmentList}">
                <td th:text="${equipment.equipmentCode}"></td>
                <td th:text="${equipment.name}"></td>
                <td th:text="${equipment.manufacturer}"></td>
                <td th:text="${equipment.location}"></td>
                <td>
                  <div class="action-links">
                    <a
                      class="ui-action-link"
                      th:href="@{/equipment/{id}(id=${equipment.id})}"
                    >
                      詳細
                    </a>

                    <a
                      class="ui-action-link"
                      sec:authorize="hasRole('INSPECTOR')"
                      th:href="@{/equipment/{id}/inspections/new(id=${equipment.id})}"
                    >
                      点検する
                    </a>

                    <a
                      class="ui-action-link"
                      th:href="@{/equipment/{id}/inspections(id=${equipment.id})}"
                    >
                      履歴
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <p class="ui-empty-state" th:if="${#lists.isEmpty(equipmentList)}">
          該当する設備がありません。
        </p>
      </section>
    </main>
  </body>
</html>
