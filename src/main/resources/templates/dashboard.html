<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>ダッシュボード</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>
  <body>
    <h1>ダッシュボード</h1>

    <form th:action="@{/dashboard}" method="get">
      <label for="keyword">設備検索</label>
      <input
        id="keyword"
        type="text"
        name="keyword"
        th:value="${keyword}"
        placeholder="設備コード・設備名・メーカー・設置場所"
      />
      <button type="submit">検索</button>
    </form>
    <h2>設備一覧</h2>
    <table border="1" th:unless="${#lists.isEmpty(equipmentList)}">
      <thead>
        <tr>
          <th>設備コード</th>
          <th>設備名</th>
          <th>メーカー</th>
          <th>設置場所</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="equipment : ${equipmentList}">
          <td th:text="${equipment.equipmentCode}"></td>
          <td th:text="${equipment.name}"></td>
          <td th:text="${equipment.manufacturer}"></td>
          <td th:text="${equipment.location}"></td>
          <td>
            <div class="action-links">
              <a
                th:href="@{/equipment/{id}/inspections/new(id=${equipment.id})}"
              >
                点検する
              </a>
              <a th:href="@{/equipment/{id}/inspections(id=${equipment.id})}">
                履歴
              </a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <p th:if="${#lists.isEmpty(equipmentList)}">該当する設備がありません。</p>
  </body>
</html>
