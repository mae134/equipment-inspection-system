<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>点検履歴詳細</title>
    <link rel="stylesheet" th:href="@{/css/inspection-history.css}" />
  </head>
  <body>
    <h1>点検履歴詳細</h1>

    <section>
      <p>点検ID: <span th:text="${detail.inspectionId}"></span></p>
      <p>設備コード: <span th:text="${detail.equipmentCode}"></span></p>
      <p>設備名: <span th:text="${detail.equipmentName}"></span></p>
      <p>
        点検日時:
        <span
          th:text="${#temporals.format(detail.inspectionAt, 'yyyy-MM-dd HH:mm')}"
        ></span>
      </p>
      <p>点検者: <span th:text="${detail.inspectorName}"></span></p>
      <p>
        総合コメント:
        <span th:text="${detail.comment != null ? detail.comment : '-'}"></span>
      </p>
    </section>

    <h2>点検結果</h2>

    <table>
      <thead>
        <tr>
          <th>項目名</th>
          <th>測定値・回答</th>
          <th>判定</th>
          <th>コメント</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="result : ${detail.results}">
          <td th:text="${result.itemName}"></td>

          <td>
            <span th:if="${result.result.name() == 'NOT_APPLICABLE'}"> - </span>

            <span
              th:if="${result.result.name() != 'NOT_APPLICABLE' and result.type.name() == 'NUMERIC'}"
            >
              <span th:text="${result.numericValue}"></span>
              <span
                th:if="${result.unit != null}"
                th:text="${result.unit}"
              ></span>
            </span>

            <span
              th:if="${result.result.name() != 'NOT_APPLICABLE' and result.type.name() == 'BOOLEAN'}"
              th:text="${result.booleanValue ? 'はい' : 'いいえ'}"
            >
            </span>
          </td>

          <td th:text="${result.result}"></td>

          <td th:text="${result.comment != null ? result.comment : '-'}"></td>
        </tr>
      </tbody>
    </table>

    <p>
      <a
        th:href="@{/equipment/{equipmentId}/inspections(equipmentId=${detail.equipmentId})}"
      >
        点検履歴一覧へ戻る
      </a>
    </p>
  </body>
</html>
