<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>設備編集</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/equipment-create.css}" />
  </head>

  <body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="ui-page">
      <header class="ui-page-header">
        <a class="ui-back-link" th:href="@{/equipment/{id}(id=${equipmentId})}">
          ← 設備詳細に戻る
        </a>
        <h1>設備編集</h1>
        <p class="ui-page-description">設備の情報を編集してください。</p>
      </header>

      <section class="ui-card">
        <form
          id="equipment-edit-form"
          th:action="@{/equipment/{id}/edit(id=${equipmentId})}"
          th:object="${equipmentForm}"
          method="post"
        >
          <div class="form-grid">
            <div class="ui-form-field">
              <label class="ui-form-label" for="equipmentCode">
                設備コード <span class="ui-required">必須</span>
              </label>
              <input
                class="ui-input"
                id="equipmentCode"
                type="text"
                th:field="*{equipmentCode}"
                th:classappend="${#fields.hasErrors('equipmentCode')} ? 'ui-input-error'"
                maxlength="20"
                placeholder="例：EQ-003"
                required
              />
              <p class="ui-field-hint">20文字以内で入力してください。</p>
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('equipmentCode')}"
                th:errors="*{equipmentCode}"
              ></p>
            </div>

            <div class="ui-form-field">
              <label class="ui-form-label" for="name">
                設備名 <span class="ui-required">必須</span>
              </label>
              <input
                class="ui-input"
                id="name"
                type="text"
                th:field="*{name}"
                th:classappend="${#fields.hasErrors('name')} ? 'ui-input-error'"
                maxlength="100"
                placeholder="例：モーター設備A"
                required
              />
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
              ></p>
            </div>

            <div class="ui-form-field">
              <label class="ui-form-label" for="manufacturer">メーカー</label>
              <input
                class="ui-input"
                id="manufacturer"
                type="text"
                th:field="*{manufacturer}"
                th:classappend="${#fields.hasErrors('manufacturer')} ? 'ui-input-error'"
                maxlength="100"
                placeholder="メーカー名"
              />
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('manufacturer')}"
                th:errors="*{manufacturer}"
              ></p>
            </div>

            <div class="ui-form-field">
              <label class="ui-form-label" for="model">型番</label>
              <input
                class="ui-input"
                id="model"
                type="text"
                th:field="*{model}"
                th:classappend="${#fields.hasErrors('model')} ? 'ui-input-error'"
                maxlength="100"
                placeholder="型番"
              />
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('model')}"
                th:errors="*{model}"
              ></p>
            </div>

            <div class="ui-form-field">
              <label class="ui-form-label" for="location">設置場所</label>
              <input
                class="ui-input"
                id="location"
                type="text"
                th:field="*{location}"
                th:classappend="${#fields.hasErrors('location')} ? 'ui-input-error'"
                maxlength="100"
                placeholder="例：第1工場"
              />
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('location')}"
                th:errors="*{location}"
              ></p>
            </div>

            <div class="ui-form-field">
              <label class="ui-form-label" for="installedDate">設置日</label>
              <input
                class="ui-input"
                id="installedDate"
                type="date"
                th:field="*{installedDate}"
                th:classappend="${#fields.hasErrors('installedDate')} ? 'ui-input-error'"
              />
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('installedDate')}"
                th:errors="*{installedDate}"
              ></p>
            </div>

            <div class="ui-form-field">
              <label class="ui-form-label" for="inspectionCycleDays">
                点検周期（日）
              </label>
              <input
                class="ui-input"
                id="inspectionCycleDays"
                type="number"
                th:field="*{inspectionCycleDays}"
                th:classappend="${#fields.hasErrors('inspectionCycleDays')} ? 'ui-input-error'"
                min="1"
                step="1"
                placeholder="例：30"
              />
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('inspectionCycleDays')}"
                th:errors="*{inspectionCycleDays}"
              ></p>
            </div>

            <div class="ui-form-field form-group-full">
              <label class="ui-form-label" for="description">備考</label>
              <textarea
                class="ui-input"
                id="description"
                th:field="*{description}"
                th:classappend="${#fields.hasErrors('description')} ? 'ui-input-error'"
                maxlength="500"
                rows="5"
                placeholder="設備に関する補足情報を入力してください"
              ></textarea>
              <p
                class="ui-field-error"
                th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}"
              ></p>
            </div>
          </div>

          <div class="ui-form-actions">
            <a
              class="ui-button ui-button-secondary"
              th:href="@{/equipment/{id}(id=${equipmentId})}"
            >
              キャンセル
            </a>
            <button class="ui-button ui-button-primary" type="submit">
              設備を更新する
            </button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById("equipment-edit-form");

      form.addEventListener("submit", () => {
        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = "更新中...";
      });
    </script>
  </body>
</html>
