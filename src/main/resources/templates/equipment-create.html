<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>設備登録</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>
  <body>
    <h1>設備登録</h1>

    <form th:action="@{/equipment}" th:object="${equipmentForm}" method="post">
      <div>
        <label for="equipmentCode">設備コード（必須）</label>
        <input
          id="equipmentCode"
          type="text"
          th:field="*{equipmentCode}"
          maxlength="20"
          required
        />
        <p
          th:if="${#fields.hasErrors('equipmentCode')}"
          th:errors="*{equipmentCode}"
        ></p>
      </div>

      <div>
        <label for="name">設備名（必須）</label>
        <input
          id="name"
          type="text"
          th:field="*{name}"
          maxlength="100"
          required
        />
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
      </div>

      <div>
        <label for="manufacturer">メーカー</label>
        <input
          id="manufacturer"
          type="text"
          th:field="*{manufacturer}"
          maxlength="100"
        />
        <p
          th:if="${#fields.hasErrors('manufacturer')}"
          th:errors="*{manufacturer}"
        ></p>
      </div>

      <div>
        <label for="model">型番</label>
        <input id="model" type="text" th:field="*{model}" maxlength="100" />
        <p th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></p>
      </div>

      <div>
        <label for="location">設置場所</label>
        <input
          id="location"
          type="text"
          th:field="*{location}"
          maxlength="100"
        />
        <p th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></p>
      </div>

      <div>
        <label for="installedDate">設置日</label>
        <input id="installedDate" type="date" th:field="*{installedDate}" />
        <p
          th:if="${#fields.hasErrors('installedDate')}"
          th:errors="*{installedDate}"
        ></p>
      </div>

      <div>
        <label for="inspectionCycleDays">点検周期（日）</label>
        <input
          id="inspectionCycleDays"
          type="number"
          th:field="*{inspectionCycleDays}"
          min="1"
          step="1"
        />
        <p
          th:if="${#fields.hasErrors('inspectionCycleDays')}"
          th:errors="*{inspectionCycleDays}"
        ></p>
      </div>

      <div>
        <label for="description">備考</label>
        <textarea
          id="description"
          th:field="*{description}"
          maxlength="500"
          rows="4"
        ></textarea>
        <p
          th:if="${#fields.hasErrors('description')}"
          th:errors="*{description}"
        ></p>
      </div>

      <div>
        <button type="submit">保存</button>
        <a th:href="@{/dashboard}">キャンセル</a>
      </div>
    </form>
  </body>
</html>
