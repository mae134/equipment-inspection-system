<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>設備登録</title>
    <link rel="stylesheet" th:href="@{/css/equipment-create.css}" />
  </head>
  <body>
    <main class="page-container">
      <header class="page-header">
        <a class="back-link" th:href="@{/dashboard}">
          ← ダッシュボードに戻る
        </a>
        <h1>設備登録</h1>
        <p class="page-description">新しい設備の情報を入力してください。</p>
      </header>

      <section class="form-card">
        <form
          th:action="@{/equipment}"
          th:object="${equipmentForm}"
          method="post"
        >
          <div class="form-grid">
            <div class="form-group">
              <label for="equipmentCode">
                設備コード <span class="required">必須</span>
              </label>
              <input
                id="equipmentCode"
                type="text"
                th:field="*{equipmentCode}"
                th:classappend="${#fields.hasErrors('equipmentCode')} ? 'is-invalid'"
                maxlength="20"
                placeholder="例：EQ-003"
                required
              />
              <p class="field-hint">20文字以内で入力してください。</p>
              <p
                class="field-error"
                th:if="${#fields.hasErrors('equipmentCode')}"
                th:errors="*{equipmentCode}"
              ></p>
            </div>

            <div class="form-group">
              <label for="name">
                設備名 <span class="required">必須</span>
              </label>
              <input
                id="name"
                type="text"
                th:field="*{name}"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                maxlength="100"
                placeholder="例：モーター設備A"
                required
              />
              <p
                class="field-error"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
              ></p>
            </div>

            <div class="form-group">
              <label for="manufacturer">メーカー</label>
              <input
                id="manufacturer"
                type="text"
                th:field="*{manufacturer}"
                maxlength="100"
                placeholder="メーカー名"
              />
              <p
                class="field-error"
                th:if="${#fields.hasErrors('manufacturer')}"
                th:errors="*{manufacturer}"
              ></p>
            </div>

            <div class="form-group">
              <label for="model">型番</label>
              <input
                id="model"
                type="text"
                th:field="*{model}"
                maxlength="100"
                placeholder="型番"
              />
              <p
                class="field-error"
                th:if="${#fields.hasErrors('model')}"
                th:errors="*{model}"
              ></p>
            </div>

            <div class="form-group">
              <label for="location">設置場所</label>
              <input
                id="location"
                type="text"
                th:field="*{location}"
                maxlength="100"
                placeholder="例：第1工場"
              />
              <p
                class="field-error"
                th:if="${#fields.hasErrors('location')}"
                th:errors="*{location}"
              ></p>
            </div>

            <div class="form-group">
              <label for="installedDate">設置日</label>
              <input
                id="installedDate"
                type="date"
                th:field="*{installedDate}"
              />
              <p
                class="field-error"
                th:if="${#fields.hasErrors('installedDate')}"
                th:errors="*{installedDate}"
              ></p>
            </div>

            <div class="form-group">
              <label for="inspectionCycleDays">点検周期（日）</label>
              <input
                id="inspectionCycleDays"
                type="number"
                th:field="*{inspectionCycleDays}"
                min="1"
                step="1"
                placeholder="例：30"
              />
              <p
                class="field-error"
                th:if="${#fields.hasErrors('inspectionCycleDays')}"
                th:errors="*{inspectionCycleDays}"
              ></p>
            </div>

            <div class="form-group form-group-full">
              <label for="description">備考</label>
              <textarea
                id="description"
                th:field="*{description}"
                maxlength="500"
                rows="5"
                placeholder="設備に関する補足情報を入力してください"
              ></textarea>
              <p
                class="field-error"
                th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}"
              ></p>
            </div>
          </div>

          <div class="form-actions">
            <a class="button button-secondary" th:href="@{/dashboard}">
              キャンセル
            </a>
            <button class="button button-primary" type="submit">
              設備を登録する
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
