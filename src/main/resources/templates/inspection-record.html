<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>点検実施</title>
  </head>
  <body>
    <h1>点検実施</h1>

    <p>
      設備コード：
      <span th:text="${equipment.equipmentCode}"></span>
    </p>

    <p>
      設備名：
      <span th:text="${equipment.name}"></span>
    </p>
    <h2>点検項目</h2>

    <table border="1">
      <thead>
        <tr>
          <th>点検項目</th>
          <th>説明</th>
          <th>正常条件</th>
          <th>入力</th>
          <th>対象外</th>
          <th>備考</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="item : ${inspectionItems}" th:if="${item.active}">
          <td th:text="${item.name}"></td>

          <td th:text="${item.description}"></td>

          <!-- 正常条件 -->
          <td>
            <span th:if="${item.type.name() == 'NUMERIC'}">
              <span th:text="${item.minValue}"></span>
              ～
              <span th:text="${item.maxValue}"></span>
              <span th:text="${item.unit}"></span>
            </span>

            <span th:if="${item.type.name() == 'BOOLEAN'}">
              正常値：
              <span
                th:text="${item.normalBooleanValue ? 'はい' : 'いいえ'}"
              ></span>
            </span>
          </td>

          <!-- 入力 -->
          <td>
            <div th:if="${item.type.name() == 'NUMERIC'}">
              <input type="number" step="any" />
              <span th:text="${item.unit}"></span>
            </div>

            <div th:if="${item.type.name() == 'BOOLEAN'}">
              <label>
                <input
                  type="radio"
                  th:name="'booleanValue-' + ${item.id}"
                  value="true"
                />
                はい
              </label>

              <label>
                <input
                  type="radio"
                  th:name="'booleanValue-' + ${item.id}"
                  value="false"
                />
                いいえ
              </label>
            </div>
          </td>

          <!-- 対象外 -->
          <td>
            <input type="checkbox" />
          </td>

          <!-- 備考 -->
          <td>
            <input type="text" maxlength="500" />
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
