<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header th:fragment="header" class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" th:href="@{/dashboard}"> 設備点検管理システム </a>

        <div class="site-user-actions" aria-label="ユーザー操作">
          <span class="site-user-name" th:text="${headerUserName}">
            山田 太郎
          </span>

          <form th:action="@{/logout}" method="post">
            <button class="site-logout-button" type="submit">ログアウト</button>
          </form>
        </div>
      </div>
    </header>
  </body>
</html>
