name: Validate PR Branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate source branch
    runs-on: ubuntu-latest

    steps:
      - name: Ensure pull request comes from dev
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail

          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"
          echo "Head repository: $HEAD_REPOSITORY"
          echo "Base repository: $BASE_REPOSITORY"

          if [[ "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::Pull requests to 'main' must come from the dev branch of the same repository."
            exit 1
          fi
