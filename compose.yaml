services:
  postgres:
    image: postgres:17
    container_name: equipment-inspection-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: equipment_inspection
      POSTGRES_USER: equipment_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U equipment_user -d equipment_inspection"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
